[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "autodevelop-ai"
version = "0.1.0"
description = "Backend service for the AutoDevelop AI Lightroom Classic plug-in"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "Pillow>=12,<13",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "PyYAML>=6.0.2,<7",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3,<10",
]

[project.urls]
Repository = "https://github.com/emadaljumah-camel/AutoDevelop-AI"
Issues = "https://github.com/emadaljumah-camel/AutoDevelop-AI/issues"

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
autodevelop = ["profiles/data/*.json"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["backend"]
testpaths = ["tests"]
